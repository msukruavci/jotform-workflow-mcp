name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JOTFORM_API_KEY: test-key
      MCP_AUDIT_FUNCTION_TRACES: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q mcp_server agent
      - run: python -m pytest -q
      - run: git diff --check
